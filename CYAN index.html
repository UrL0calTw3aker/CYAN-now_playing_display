<!doctype html> <html lang="en"> <head> <meta charset="utf-8"> <meta name="viewport" content="width=device-width,initial-scale=1"> <title>Now Playing</title> <style> :root{--amber:#00FAD2;--dim:#004B49;--bg:#050403} *{box-sizing:border-box} html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg)} body{color:var(--amber);font-family:"Courier New",monospace;text-shadow:0 0 6px rgba(0,250,210,.45)} body:after{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(to bottom,rgba(0,250,210,.025) 0,rgba(0,250,210,.025) 1px,transparent 1px,transparent 4px)} #idle{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:46px;letter-spacing:8px;white-space:nowrap} #playing{display:none;position:absolute;inset:0;padding:55px 65px} #header{font-size:32px;letter-spacing:5px;border-bottom:1px solid var(--dim);padding-bottom:12px;margin-bottom:38px} .content{display:flex;align-items:flex-start;gap:45px} #albumArt{width:320px;height:320px;object-fit:cover;display:none;box-shadow:0 0 15px rgba(0,250,210,.25)} #information{padding-top:8px;min-width:0} #song{font-size:36px;font-weight:bold;line-height:1.15;max-width:700px;word-wrap:break-word} #artist{margin-top:20px;font-size:25px} #album{margin-top:14px;font-size:20px;color:var(--dim)} #status{margin-top:45px;font-size:19px;letter-spacing:3px} #progressArea{position:absolute;left:65px;right:65px;bottom:105px} #progressBar{width:100%;height:8px;border:1px solid var(--dim);padding:1px} #progressFill{height:100%;width:0;background:var(--amber);box-shadow:0 0 8px rgba(0,250,210,.55)} #times{display:flex;justify-content:space-between;margin-top:12px;font-size:18px} #connect{position:absolute;left:50%;top:58%;transform:translate(-50%,-50%);background:transparent;color:var(--amber);border:1px solid var(--amber);padding:14px 24px;font:18px "Courier New",monospace;letter-spacing:2px;cursor:pointer;box-shadow:0 0 8px rgba(0,250,210,.2)} #connect:hover{background:rgba(0,250,210,.08)} #error{display:none;position:absolute;left:50%;bottom:30px;transform:translateX(-50%);color:var(--dim);font-size:14px;white-space:nowrap} @media(max-width:900px){#playing{padding:30px}#header{font-size:25px}#albumArt{width:230px;height:230px}#song{font-size:27px}#artist{font-size:20px}#progressArea{left:30px;right:30px}} </style> </head> <body> <div id="idle">НЕТ СИГНАЛА</div> <div id="playing"> <div id="header">NOW PLAYING</div> <div class="content"> <img id="albumArt" alt="Album artwork"> <div id="information"> <div id="song"></div> <div id="artist"></div> <div id="album"></div> <div id="status"></div> </div> </div> <div id="progressArea"> <div id="progressBar"><div id="progressFill"></div></div> <div id="times"><span id="elapsed">0:00</span><span id="duration">0:00</span></div> </div> </div> <button id="connect">CONNECT SPOTIFY</button> <div id="error"></div> <script> const CLIENT_ID="edb075fb16fa43dba9de1edc3afdffb1"; const REDIRECT_URI=window.location.origin+window.location.pathname; const SCOPES="user-read-currently-playing user-read-playback-state"; const PLAYER_API="https://api.spotify.com/v1/me/player"; const TOKEN_API="https://accounts.spotify.com/api/token"; const idle=document.getElementById("idle"), playing=document.getElementById("playing"), connect=document.getElementById("connect"), errorBox=document.getElementById("error"); const song=document.getElementById("song"), artist=document.getElementById("artist"), album=document.getElementById("album"), status=document.getElementById("status"), art=document.getElementById("albumArt"), fill=document.getElementById("progressFill"), elapsed=document.getElementById("elapsed"), duration=document.getElementById("duration"); let accessToken=localStorage.getItem("spotify_access_token"); let refreshToken=localStorage.getItem("spotify_refresh_token"); let expiresAt=Number(localStorage.getItem("spotify_expires_at")||0); function randomString(length=64){const chars="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~";const a=crypto.getRandomValues(new Uint8Array(length));return [...a].map(v=>chars[v%chars.length]).join("")} async function sha256(text){return crypto.subtle.digest("SHA-256",new TextEncoder().encode(text))} function base64url(buffer){return btoa(String.fromCharCode(...new Uint8Array(buffer))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/g,"")} function fmt(ms){const s=Math.max(0,Math.floor(ms/1000));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")} function showIdle(){idle.style.display="flex";playing.style.display="none"} function showPlaying(){idle.style.display="none";playing.style.display="block"} function showError(msg){errorBox.textContent=msg;errorBox.style.display="block";setTimeout(()=>errorBox.style.display="none",5000)} async function login(){ const verifier=randomString(); const challenge=base64url(await sha256(verifier)); const state=randomString(24); localStorage.setItem("spotify_code_verifier",verifier); localStorage.setItem("spotify_state",state); const u=new URL("https://accounts.spotify.com/authorize"); u.search=new URLSearchParams({client_id:CLIENT_ID,response_type:"code",redirect_uri:REDIRECT_URI,scope:SCOPES,code_challenge_method:"S256",code_challenge:challenge,state}).toString(); location.href=u.toString(); } async function exchangeCode(code){ const verifier=localStorage.getItem("spotify_code_verifier"); if(!verifier) throw new Error("Missing Spotify login verifier. Please connect again."); const r=await fetch(TOKEN_API,{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:new URLSearchParams({client_id:CLIENT_ID,grant_type:"authorization_code",code,redirect_uri:REDIRECT_URI,code_verifier:verifier})}); const d=await r.json(); if(!r.ok) throw new Error(d.error_description||"Spotify authorization failed."); storeTokens(d); localStorage.removeItem("spotify_code_verifier"); localStorage.removeItem("spotify_state"); history.replaceState({},document.title,REDIRECT_URI); } async function refreshAccessToken(){ if(!refreshToken) return false; const r=await fetch(TOKEN_API,{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:new URLSearchParams({client_id:CLIENT_ID,grant_type:"refresh_token",refresh_token:refreshToken})}); const d=await r.json(); if(!r.ok){localStorage.removeItem("spotify_access_token");localStorage.removeItem("spotify_refresh_token");localStorage.removeItem("spotify_expires_at");accessToken=null;refreshToken=null;return false} storeTokens(d); return true; } function storeTokens(d){accessToken=d.access_token;expiresAt=Date.now()+Number(d.expires_in||3600)*1000;if(d.refresh_token) refreshToken=d.refresh_token;localStorage.setItem("spotify_access_token",accessToken);localStorage.setItem("spotify_expires_at",String(expiresAt));if(refreshToken)localStorage.setItem("spotify_refresh_token",refreshToken)} async function update(){ if(!accessToken){connect.style.display="block";showIdle();return} if(Date.now()>=expiresAt-60000){if(!(await refreshAccessToken())){connect.style.display="block";showIdle();return}} try{ let r=await fetch(PLAYER_API,{headers:{Authorization:"Bearer "+accessToken}}); if(r.status===401){if(await refreshAccessToken()) r=await fetch(PLAYER_API,{headers:{Authorization:"Bearer "+accessToken}});else{connect.style.display="block";showIdle();return}} if(r.status===204){showIdle();return} if(!r.ok) throw new Error("Spotify API error: "+r.status); const d=await r.json(); if(!d||!d.item||d.currently_playing_type!=="track"){showIdle();return} const t=d.item; song.textContent=t.name||""; artist.textContent=(t.artists||[]).map(a=>a.name).join(", "); album.textContent=t.album?.name?"ALBUM: "+t.album.name:""; status.textContent=d.is_playing?"● PLAYING":"Ⅱ PAUSED"; const image=t.album?.images?.[0]?.url; if(image){art.src=image;art.style.display="block"}else art.style.display="none"; const total=t.duration_ms||0,current=d.progress_ms||0; elapsed.textContent=fmt(current);duration.textContent=fmt(total);fill.style.width=total?Math.min(100,current/total*100)+"%":"0%"; connect.style.display="none";showPlaying(); }catch(e){showError(e.message||"Connection error.")} } connect.addEventListener("click",login); (async function(){ const p=new URLSearchParams(location.search),code=p.get("code"),returnedState=p.get("state"),err=p.get("error"); if(err){showError("Spotify authorization cancelled.");history.replaceState({},document.title,REDIRECT_URI)} if(code){const saved=localStorage.getItem("spotify_state");if(!saved||returnedState!==saved){showError("Authorization state mismatch. Please connect again.");return}try{connect.style.display="none";await exchangeCode(code)}catch(e){showError(e.message)}} if(accessToken){connect.style.display="none";showIdle();await update();setInterval(update,5000)}else showIdle(); })(); </script> </body> </html>
